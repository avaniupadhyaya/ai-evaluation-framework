name: CI

on:
  push:
    branches: [main, "build/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q
      - name: Run sample eval
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: >-
          python run_eval.py
          --config configs/sample_eval.yaml
          --output artifacts/eval_results.json
          --report-dir artifacts/reports
      - name: Upload eval artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            artifacts/eval_results.json
            artifacts/reports/eval_report.md
            artifacts/reports/eval_report.html
